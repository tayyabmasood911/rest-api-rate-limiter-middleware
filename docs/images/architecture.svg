<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="70" y="60" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="0.3">Distributed Sliding Window Rate Limiter Architecture</text>
  <rect x="850" y="40" width="85" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="864" y="58" fill="#047857" font-size="11" font-weight="600">PRODUCTION</text>
  <rect x="945" y="40" width="95" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="958" y="58" fill="#1d4ed8" font-size="11" font-weight="600">REDIS ZSET</text>
  <rect x="1050" y="40" width="95" height="26" rx="13" fill="#fdf4ff" stroke="#c084fc" stroke-width="1"/>
  <text x="1064" y="58" fill="#9333ea" font-size="11" font-weight="600">RFC 6585</text>

  <!-- COLUMN 1: Client Ingress & Identification -->
  <rect x="40" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="40" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="60" y="136" fill="#0284c7" font-size="13" font-weight="700">1. INGRESS &amp; CLIENTS</text>

  <rect x="60" y="170" width="210" height="90" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="75" y="198" fill="#0369a1" font-size="13" font-weight="600">HTTP/REST Ingress</text>
  <text x="75" y="222" fill="#0c4a6e" font-size="11">External API Consumers</text>
  <text x="75" y="242" fill="#0284c7" font-size="10">Web, Mobile &amp; B2B Integrations</text>

  <rect x="60" y="280" width="210" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="308" fill="#0f172a" font-size="13" font-weight="600">Identity Extractors</text>
  <text x="75" y="332" fill="#64748b" font-size="11">X-Forwarded-For IP</text>
  <text x="75" y="352" fill="#64748b" font-size="10">Bearer JWT / API Key Token</text>

  <rect x="60" y="390" width="210" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="418" fill="#0f172a" font-size="13" font-weight="600">Key Partitioning</text>
  <text x="75" y="442" fill="#64748b" font-size="11">ratelimit:{tier}:{identifier}</text>
  <text x="75" y="460" fill="#64748b" font-size="10">Multi-tier quota differentiation</text>

  <rect x="60" y="495" width="210" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="523" fill="#0f172a" font-size="13" font-weight="600">Protection Thresholds</text>
  <text x="75" y="547" fill="#64748b" font-size="11">DDoS &amp; Brute-Force Shield</text>
  <text x="75" y="565" fill="#64748b" font-size="10">Fair-share capacity preservation</text>

  <!-- COLUMN 2: Middleware Engine -->
  <rect x="320" y="110" width="260" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="320" y="110" width="260" height="40" rx="8" fill="#f1f5f9"/>
  <text x="340" y="136" fill="#8b5cf6" font-size="13" font-weight="700">2. MIDDLEWARE ENGINE</text>

  <rect x="340" y="170" width="220" height="95" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="355" y="198" fill="#6d28d9" font-size="13" font-weight="700">Dual Framework Support</text>
  <text x="355" y="222" fill="#5b21b6" font-size="11">Express.js RateLimiter (Node)</text>
  <text x="355" y="242" fill="#4c1d95" font-size="11">FastAPI async RateLimiter (Py)</text>
  <text x="355" y="258" fill="#6d28d9" font-size="10">Drop-in middleware &amp; Depends()</text>

  <rect x="340" y="285" width="220" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="355" y="313" fill="#0f172a" font-size="13" font-weight="600">RFC 6585 Header Engine</text>
  <text x="355" y="337" fill="#64748b" font-size="11">X-RateLimit-Limit: 100</text>
  <text x="355" y="355" fill="#64748b" font-size="11">X-RateLimit-Remaining: 42</text>
  <text x="355" y="373" fill="#64748b" font-size="11">X-RateLimit-Reset: 1732450000</text>

  <rect x="340" y="400" width="220" height="100" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="355" y="428" fill="#15803d" font-size="13" font-weight="700">In-Memory Fallback</text>
  <text x="355" y="452" fill="#166534" font-size="11">Thread-safe deque sliding window</text>
  <text x="355" y="472" fill="#14532d" font-size="10">Zero downtime if Redis degrades</text>
  <text x="355" y="490" fill="#15803d" font-size="10">Fail-open / Fail-safe resilience</text>

  <rect x="340" y="520" width="220" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="355" y="545" fill="#0f172a" font-size="12" font-weight="600">Sub-Millisecond Overhead</text>
  <text x="355" y="563" fill="#64748b" font-size="10">&lt; 0.5ms median evaluation latency</text>

  <!-- COLUMN 3: Redis Atomic Lua Engine -->
  <rect x="610" y="110" width="280" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="610" y="110" width="280" height="40" rx="8" fill="#f1f5f9"/>
  <text x="630" y="136" fill="#d97706" font-size="13" font-weight="700">3. ATOMIC REDIS LUA ENGINE</text>

  <rect x="630" y="170" width="240" height="135" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="645" y="198" fill="#b45309" font-size="13" font-weight="700">Sliding Window Log (ZSET)</text>
  <text x="645" y="222" fill="#78350f" font-size="11">1. ZREMRANGEBYSCORE (evict past)</text>
  <text x="645" y="242" fill="#78350f" font-size="11">2. ZCARD (count current in window)</text>
  <text x="645" y="262" fill="#78350f" font-size="11">3. ZADD (record current timestamp)</text>
  <text x="645" y="282" fill="#78350f" font-size="11">4. PEXPIRE (auto garbage-collect)</text>

  <rect x="630" y="325" width="240" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="645" y="353" fill="#0f172a" font-size="13" font-weight="600">Zero Race Conditions</text>
  <text x="645" y="377" fill="#64748b" font-size="11">Atomic evaluation via Redis EVAL</text>
  <text x="645" y="395" fill="#64748b" font-size="10">Eliminates fixed-window 2x burst flaw</text>

  <rect x="630" y="430" width="240" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="645" y="458" fill="#0f172a" font-size="13" font-weight="600">Precision Reset Calculation</text>
  <text x="645" y="482" fill="#64748b" font-size="11">Inspects oldest timestamp in ZSET</text>
  <text x="645" y="500" fill="#64748b" font-size="10">Computes exact seconds until quota freed</text>

  <rect x="630" y="535" width="240" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="645" y="560" fill="#0f172a" font-size="11" font-weight="600">Automatic Redis TTL Expiration</text>

  <!-- COLUMN 4: Response & Quota Monitoring -->
  <rect x="920" y="110" width="240" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="920" y="110" width="240" height="40" rx="8" fill="#f1f5f9"/>
  <text x="940" y="136" fill="#dc2626" font-size="13" font-weight="700">4. RESPONSE &amp; METRICS</text>

  <rect x="940" y="170" width="200" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="955" y="198" fill="#15803d" font-size="13" font-weight="700">HTTP 200 OK</text>
  <text x="955" y="222" fill="#166534" font-size="11">Request within quota</text>
  <text x="955" y="242" fill="#14532d" font-size="10">Pass to downstream handler</text>
  <text x="955" y="260" fill="#15803d" font-size="10">Attach X-RateLimit headers</text>

  <rect x="940" y="300" width="200" height="110" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="955" y="328" fill="#991b1b" font-size="13" font-weight="700">HTTP 429 Too Many</text>
  <text x="955" y="352" fill="#b91c1c" font-size="11">Header: Retry-After: 18</text>
  <text x="955" y="372" fill="#7f1d1d" font-size="10">Standard JSON error payload</text>
  <text x="955" y="390" fill="#7f1d1d" font-size="10">Prevents backend saturation</text>

  <rect x="940" y="430" width="200" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="955" y="458" fill="#0f172a" font-size="13" font-weight="600">Prometheus Telemetry</text>
  <text x="955" y="482" fill="#64748b" font-size="11">rate_limit_exceeded_total</text>
  <text x="955" y="500" fill="#64748b" font-size="10">Client quota consumption gauges</text>

  <rect x="940" y="535" width="200" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="955" y="560" fill="#0f172a" font-size="11" font-weight="600">Security Audit Logs</text>
</svg>
